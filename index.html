<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede de Combate ao Câncer - Sistema de Doações e Estoque</title>
    
    <!-- Design System & Estilos Globais -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles/main.css">

    <!-- Dependências e SDKs Externos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- React 18 & Babel Standalone para Arquitetura Modular de Componentes -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Prevenção instantânea de flash de cor no carregamento
        (function () {
            const savedTheme = localStorage.getItem('site-theme') || 'light';
            document.documentElement.classList.add('theme-' + savedTheme);
        })();
    </script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-rose-500 selection:text-white transition-colors duration-200">
    <!-- Ponto de Montagem do App React -->
    <div id="root"></div>

    <!-- Carregador Modular React ES6/JSX -->
    <script type="text/babel" data-type="module">
        import { App } from './src/App.jsx';

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>

</html>
