<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede de Combate ao Câncer - Sistema de Doações e Estoque</title>

    <!-- Design System & Estilos Globais -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles/main.css">

    <!-- Dependências e SDKs Externos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- React 18 & Babel Standalone (Compilação em Memória sem CORS local) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Execução instantânea para evitar flash branco no carregamento
        (function () {
            const savedTheme = localStorage.getItem('site-theme') || 'light';
            document.documentElement.classList.add('theme-' + savedTheme);
        })();
    </script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-rose-500 selection:text-white transition-colors duration-200">
    <!-- Ponto de Montagem do App React -->
    <div id="root"></div>

    <!-- Módulos da Aplicação React -->
    <script type="text/babel">
        // ==========================================
        // 1. CONFIGURAÇÃO E UTILS
        // ==========================================
        const SUPABASE_URL = "https://bevvvsghutwpnexuczda.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CaMU6q53y-n9p0PXW4F1Ow_bgYrD9Mm";
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function formatarCPF(val) {
            if (!val) return "";
            val = val.replace(/\D/g, "").slice(0, 11);
            return val
                .replace(/^(\d{3})(\d)/, "$1.$2")
                .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
                .replace(/\.(\d{3})(\d)/, ".$1-$2");
        }

        function formatarCNPJ(val) {
            if (!val) return "";
            val = val.replace(/\D/g, "").slice(0, 14);
            return val
                .replace(/^(\d{2})(\d)/, "$1.$2")
                .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
                .replace(/\.(\d{3})(\d)/, ".$1/$2")
                .replace(/(\d{4})(\d)/, "$1-$2");
        }

        function formatarDocumento(val, tipo) {
            if (!val) return "";
            if (tipo === 'PF') return formatarCPF(val);
            if (tipo === 'PJ') return formatarCNPJ(val);
            const clean = val.replace(/\D/g, "");
            return clean.length > 11 ? formatarCNPJ(clean) : formatarCPF(clean);
        }

        function formatarTelefone(val) {
            if (!val) return "";
            val = val.replace(/\D/g, "").slice(0, 11);
            if (val.length > 10) {
                return val.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d)/, "$1-$2");
            } else {
                return val.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{4})(\d)/, "$1-$2");
            }
        }

        function formatarMoeda(valor) {
            const num = parseFloat(valor || 0);
            return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatarDataBR(dataIso) {
            if (!dataIso) return '-';
            const partes = dataIso.split('-');
            if (partes.length === 3) {
                return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0].slice(0, 4)}`;
            }
            return dataIso;
        }

        // ==========================================
        // 2. SERVIÇOS BANCO DE DADOS E RELATÓRIOS
        // ==========================================
        const authService = {
            verificarSessaoSupabase: async () => {
                if (!supabaseClient) return { session: null };
                const { data: { session } } = await supabaseClient.auth.getSession();
                return { session };
            },
            realizarLoginSupabase: async (email, password) => {
                if (!supabaseClient) throw new Error("Supabase não configurado");
                return await supabaseClient.auth.signInWithPassword({ email, password });
            },
            realizarLogoutSupabase: async () => {
                if (!supabaseClient) return;
                return await supabaseClient.auth.signOut();
            }
        };

        const doadoresService = {
            buscarDoadores: async () => {
                if (!supabaseClient) return { data: [], error: null };
                return await supabaseClient.from('doadores').select('id_doador, nome, tipo_doador, documento, telefone, email, cidade, data_nascimento').order('nome');
            },
            buscarDoadoresTodos: async () => {
                if (!supabaseClient) return { data: [], error: null };
                return await supabaseClient.from('doadores').select('*').order('nome');
            },
            criarDoador: async (dadosDoador) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                return await supabaseClient.from('doadores').insert([dadosDoador]).select();
            },
            atualizarDoador: async (idDoador, dadosDoador) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                return await supabaseClient.from('doadores').update(dadosDoador).eq('id_doador', idDoador);
            },
            deletarDoadorCascata: async (idDoador) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                const { data: listDoacoes, error: errList } = await supabaseClient.from('doacoes').select('id_doacao').eq('id_doador', idDoador);
                if (errList) throw errList;
                if (listDoacoes && listDoacoes.length > 0) {
                    const idsDoacoes = listDoacoes.map(d => d.id_doacao);
                    await supabaseClient.from('doacoes_financeiras').delete().in('id_doacao', idsDoacoes);
                    await supabaseClient.from('doacoes_materiais').delete().in('id_doacao', idsDoacoes);
                    await supabaseClient.from('doacoes').delete().in('id_doacao', idsDoacoes);
                }
                return await supabaseClient.from('doadores').delete().eq('id_doador', idDoador);
            }
        };

        const doacoesService = {
            buscarCategoriasItens: async () => {
                if (!supabaseClient) return { data: [], error: null };
                return await supabaseClient.from('categorias_itens').select('id_categoria, nome_categoria').order('id_categoria');
            },
            criarEventoDoacao: async (dadosDoacao) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                return await supabaseClient.from('doacoes').insert([dadosDoacao]).select();
            },
            criarDoacaoFinanceira: async (dadosFin) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                return await supabaseClient.from('doacoes_financeiras').insert([dadosFin]);
            },
            criarDoacaoMaterial: async (dadosMat) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                return await supabaseClient.from('doacoes_materiais').insert([dadosMat]);
            },
            buscarDoacoesAdmin: async () => {
                if (!supabaseClient) return { data: [], error: null };
                const { data, error } = await supabaseClient
                    .from('doacoes')
                    .select('*, doadores(nome), doacoes_financeiras(*), doacoes_materiais(*)')
                    .order('data_doacao', { ascending: false });

                if (error) return { data: [], error };
                const listaNormalizada = (data || []).map(d => {
                    if (d.canal_recebimento === 'Conta Bancária' || d.canal_recebimento === 'Cofrinho' || d.canal_recebimento === 'Bazar') {
                        d.canal_recebimento = 'Dinheiro';
                    }
                    return d;
                });
                return { data: listaNormalizada, error: null };
            },
            deletarDoacaoCompleta: async (idDoacao) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                await supabaseClient.from('doacoes_financeiras').delete().eq('id_doacao', idDoacao);
                await supabaseClient.from('doacoes_materiais').delete().eq('id_doacao', idDoacao);
                return await supabaseClient.from('doacoes').delete().eq('id_doacao', idDoacao);
            },
            atualizarDoacaoCompleta: async (idDoacao, dadosPai, dadosFin, dadosMat, editHasFin, editHasMat, originalDoacao) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                await supabaseClient.from('doacoes').update(dadosPai).eq('id_doacao', idDoacao);
                if (editHasFin) {
                    const originallyHadFin = originalDoacao && originalDoacao.doacoes_financeiras && originalDoacao.doacoes_financeiras.length > 0;
                    if (originallyHadFin) {
                        await supabaseClient.from('doacoes_financeiras').update(dadosFin).eq('id_doacao', idDoacao);
                    } else {
                        await supabaseClient.from('doacoes_financeiras').insert([dadosFin]);
                    }
                } else {
                    await supabaseClient.from('doacoes_financeiras').delete().eq('id_doacao', idDoacao);
                }
                if (editHasMat) {
                    const originallyHadMat = originalDoacao && originalDoacao.doacoes_materiais && originalDoacao.doacoes_materiais.length > 0;
                    if (originallyHadMat) {
                        await supabaseClient.from('doacoes_materiais').update(dadosMat).eq('id_doacao', idDoacao);
                    } else {
                        await supabaseClient.from('doacoes_materiais').insert([dadosMat]);
                    }
                } else {
                    await supabaseClient.from('doacoes_materiais').delete().eq('id_doacao', idDoacao);
                }
                return true;
            }
        };

        const estoqueService = {
            buscarEstoqueMateriais: async () => {
                if (!supabaseClient) return { data: [], error: null };
                const { data: matData, error } = await supabaseClient
                    .from('doacoes_materiais')
                    .select('*, categorias_itens(nome_categoria), doacoes(data_doacao, canal_recebimento, observacoes)')
                    .order('id_material', { ascending: false });

                if (error) return { data: [], error };
                const listaNormalizada = (matData || []).map(m => {
                    if (m.doacoes && (m.doacoes.canal_recebimento === 'Conta Bancária' || m.doacoes.canal_recebimento === 'Cofrinho' || m.doacoes.canal_recebimento === 'Bazar')) {
                        m.doacoes.canal_recebimento = 'Dinheiro';
                    }
                    return m;
                });
                return { data: listaNormalizada, error: null };
            },
            buscarEstoqueDoacoesCanais: async () => {
                if (!supabaseClient) return { data: [], error: null };
                const { data: doaData, error } = await supabaseClient
                    .from('doacoes')
                    .select('*, doacoes_financeiras(*), doacoes_materiais(*, categorias_itens(nome_categoria)))')
                    .order('data_doacao', { ascending: false });

                if (error) return { data: [], error };
                const listaNormalizada = (doaData || []).map(d => {
                    if (d.canal_recebimento === 'Conta Bancária' || d.canal_recebimento === 'Cofrinho' || d.canal_recebimento === 'Bazar') {
                        d.canal_recebimento = 'Dinheiro';
                    }
                    return d;
                });
                return { data: listaNormalizada, error: null };
            },
            atualizarItemEstoqueLote: async (idMaterial, dadosItem) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                return await supabaseClient.from('doacoes_materiais').update(dadosItem).eq('id_material', idMaterial);
            },
            atualizarEstoqueConsolidado: async (lotes, diferenca, novosDados) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                const updatePromises = lotes.map((lote, index) => {
                    let qtdLote = lote.quantidade;
                    if (index === 0) qtdLote = Math.max(0, lote.quantidade + diferenca);
                    return supabaseClient.from('doacoes_materiais').update({ ...novosDados, quantidade: qtdLote }).eq('id_material', lote.id_material);
                });
                await Promise.all(updatePromises);
                return true;
            }
        };

        const pdfService = {
            exportarPDFEstoqueOficial: async () => {
                if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF não disponível");
                const { data: matData, error } = await supabaseClient.from('doacoes_materiais').select('*, categorias_itens(nome_categoria)').order('id_categoria', { ascending: true });
                if (error) throw error;
                const materiais = matData || [];
                if (materiais.length === 0) return { success: false, message: "Não há itens em estoque para gerar PDF." };

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const agora = new Date();
                const dataFormatada = agora.toLocaleDateString('pt-BR');
                const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                doc.setFillColor(225, 29, 72);
                doc.rect(0, 0, 297, 24, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.text("REDE DE COMBATE AO CÂNCER DE CATANDUVA", 14, 12);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text("RELATÓRIO OFICIAL DE ITENS E MATERIAIS EM ESTOQUE", 14, 18);
                doc.setFontSize(9);
                doc.text(`Gerado em: ${dataFormatada} às ${horaFormatada}`, 283, 15, { align: 'right' });

                const totalItens = materiais.reduce((acc, m) => acc + parseInt(m.quantidade || 0), 0);
                const totalBazar = materiais.filter(m => m.destino_item === 'Bazar' || m.id_categoria === 6).reduce((acc, m) => acc + parseInt(m.quantidade || 0), 0);
                const totalAlimentos = materiais.filter(m => m.id_categoria === 2).reduce((acc, m) => acc + parseInt(m.quantidade || 0), 0);
                const totalHigiene = materiais.filter(m => m.id_categoria === 3).reduce((acc, m) => acc + parseInt(m.quantidade || 0), 0);

                doc.setFillColor(248, 250, 252);
                doc.setDrawColor(226, 232, 240);
                doc.roundedRect(14, 28, 269, 14, 2, 2, 'FD');
                doc.setFont("helvetica", "bold");
                doc.setFontSize(9);
                doc.setTextColor(51, 65, 85);
                doc.text(`TOTAL GERAL: ${totalItens} itens`, 20, 36.5);
                doc.text(`BAZAR: ${totalBazar} un.`, 90, 36.5);
                doc.text(`ALIMENTOS: ${totalAlimentos} un.`, 150, 36.5);
                doc.text(`HIGIENE: ${totalHigiene} un.`, 220, 36.5);

                const grupos = {};
                materiais.forEach(item => {
                    const catNome = item.categorias_itens ? item.categorias_itens.nome_categoria : 'Geral';
                    const key = `${item.descricao_item.trim().toLowerCase()}_${catNome.toLowerCase()}_${item.destino_item.toLowerCase()}_${item.unidade_medida.toLowerCase()}`;
                    if (!grupos[key]) {
                        grupos[key] = {
                            descricao: item.descricao_item,
                            categoria: catNome,
                            quantidade: 0,
                            unidade: item.unidade_medida,
                            estado: item.estado_conservacao || 'Não se aplica',
                            destino: item.destino_item
                        };
                    }
                    grupos[key].quantidade += parseInt(item.quantidade || 0);
                });

                const tableRows = Object.values(grupos).map((g, index) => [
                    index + 1, g.descricao, g.categoria, g.quantidade, g.unidade, g.estado, g.destino
                ]);

                doc.autoTable({
                    startY: 46,
                    head: [['#', 'Descrição do Item / Material', 'Categoria', 'Qtd Disponível', 'Unidade', 'Estado Conservação', 'Destino Atual']],
                    body: tableRows,
                    theme: 'striped',
                    headStyles: { fillColor: [225, 29, 72], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 9, halign: 'left' },
                    columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 85, fontStyle: 'bold' }, 2: { cellWidth: 50 }, 3: { cellWidth: 30, halign: 'center', fontStyle: 'bold' }, 4: { cellWidth: 25 }, 5: { cellWidth: 34 }, 6: { cellWidth: 35 } },
                    bodyStyles: { fontSize: 8.5, textColor: [30, 41, 59] },
                    alternateRowStyles: { fillColor: [252, 252, 253] },
                    margin: { left: 14, right: 14 },
                    didDrawPage: function (data) {
                        const pageCount = doc.internal.getNumberOfPages();
                        doc.setFontSize(8);
                        doc.setTextColor(148, 163, 184);
                        doc.text(`Página ${data.pageNumber} de ${pageCount}`, 283, 202, { align: 'right' });
                        doc.text(`Rede de Combate ao Câncer - Sistema de Gestão de Doações e Estoque`, 14, 202);
                    }
                });

                const nomeArquivo = `Relatorio_Estoque_RedeCombateCancer_${dataFormatada.replace(/\//g, '-')}.pdf`;
                doc.save(nomeArquivo);
                return { success: true, filename: nomeArquivo };
            }
        };

        // ==========================================
        // 3. REACT CONTEXT PROVIDERS
        // ==========================================
        const { createContext, useContext, useState, useEffect } = React;

        const AuthContext = createContext();
        function AuthProvider({ children, onLoadingStart, onLoadingEnd }) {
            const [authenticated, setAuthenticated] = useState(() => sessionStorage.getItem('app_autenticado') === 'true');
            const [session, setSession] = useState(null);

            const checkAuth = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const { session: sess } = await authService.verificarSessaoSupabase();
                    setSession(sess);
                    if (sess || sessionStorage.getItem('app_autenticado') === 'true') {
                        sessionStorage.setItem('app_autenticado', 'true');
                        setAuthenticated(true);
                    } else {
                        setAuthenticated(false);
                    }
                } catch (e) {
                    console.error("Erro na checagem de autenticação:", e);
                } finally {
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            useEffect(() => { checkAuth(); }, []);

            const login = async (email, password) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const { data, error } = await authService.realizarLoginSupabase(email, password);
                    if (error) throw error;
                    sessionStorage.setItem('app_autenticado', 'true');
                    setAuthenticated(true);
                    setSession(data ? data.session : null);
                    return { success: true };
                } catch (error) {
                    return { success: false, error };
                } finally {
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            const logout = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await authService.realizarLogoutSupabase();
                } catch (e) {
                    console.error(e);
                } finally {
                    sessionStorage.removeItem('app_autenticado');
                    setAuthenticated(false);
                    setSession(null);
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            return (
                <AuthContext.Provider value={{ authenticated, session, login, logout, checkAuth }}>
                    {children}
                </AuthContext.Provider>
            );
        }
        function useAuth() { return useContext(AuthContext); }

        const ThemeContext = createContext();
        function ThemeProvider({ children, onShowToast }) {
            const [theme, setThemeState] = useState(() => localStorage.getItem('site-theme') || 'light');
            const [menuOpen, setMenuOpen] = useState(false);

            const applyTheme = (newTheme) => {
                setThemeState(newTheme);
                localStorage.setItem('site-theme', newTheme);
                document.body.classList.remove('theme-light', 'theme-dark', 'theme-ultra-dark');
                document.documentElement.classList.remove('theme-light', 'theme-dark', 'theme-ultra-dark');
                document.body.classList.add('theme-' + newTheme);
                document.documentElement.classList.add('theme-' + newTheme);
            };

            useEffect(() => { applyTheme(theme); }, []);

            const changeTheme = (newTheme) => {
                applyTheme(newTheme);
                setMenuOpen(false);
                if (onShowToast) {
                    if (newTheme === 'ultra-dark') onShowToast('Modo Visão Sensível (Baixa Luminosidade) ativado!', 'info');
                    else if (newTheme === 'dark') onShowToast('Modo Escuro Padrão ativado!', 'info');
                    else onShowToast('Modo Claro Padrão ativado!', 'info');
                }
            };

            const toggleMenu = (e) => {
                if (e) e.stopPropagation();
                setMenuOpen(prev => !prev);
            };

            useEffect(() => {
                const handleOutsideClick = (e) => {
                    if (!e.target.closest('.theme-selector-container')) setMenuOpen(false);
                };
                document.addEventListener('click', handleOutsideClick);
                return () => document.removeEventListener('click', handleOutsideClick);
            }, []);

            return (
                <ThemeContext.Provider value={{ theme, changeTheme, menuOpen, toggleMenu }}>
                    {children}
                </ThemeContext.Provider>
            );
        }
        function useTheme() { return useContext(ThemeContext); }

        const ToastContext = createContext();
        function ToastProvider({ children }) {
            const [toasts, setToasts] = useState([]);

            const mostrarToast = (mensagem, tipo = 'success') => {
                const id = Date.now() + Math.random();
                const newToast = { id, mensagem, tipo, isExiting: false };
                setToasts(prev => [...prev, newToast]);
                setTimeout(() => removerToast(id), 4000);
            };

            const removerToast = (id) => {
                setToasts(prev => prev.map(t => t.id === id ? { ...t, isExiting: true } : t));
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 300);
            };

            return (
                <ToastContext.Provider value={{ toasts, mostrarToast, removerToast }}>
                    {children}
                </ToastContext.Provider>
            );
        }
        function useToast() { return useContext(ToastContext); }

        // ==========================================
        // 4. COMPONENTES UI COMUNS
        // ==========================================
        function ProgressBar({ width, opacity }) {
            return (
                <div id="global-progress-bar" style={{ width: `${width}%`, opacity: opacity }} />
            );
        }

        function ToastContainer() {
            const { toasts, removerToast } = useToast();
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [toasts]);

            return (
                <div id="toast-container" className="fixed top-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none">
                    {toasts.map(toast => {
                        let bgClass = toast.tipo === 'success' ? 'bg-emerald-50/95 border-emerald-150 text-emerald-800 shadow-emerald-500/5' :
                            toast.tipo === 'error' ? 'bg-rose-50/95 border-rose-150 text-rose-800 shadow-rose-500/5' :
                                'bg-blue-50/95 border-blue-150 text-blue-800 shadow-blue-500/5';
                        let iconName = toast.tipo === 'success' ? 'check-circle-2' : toast.tipo === 'error' ? 'alert-circle' : 'info';

                        return (
                            <div
                                key={toast.id}
                                onClick={() => removerToast(toast.id)}
                                className={`toast-item p-4 rounded-xl shadow-lg border backdrop-blur-md flex items-center gap-3 transition-all duration-300 pointer-events-auto cursor-pointer max-w-sm w-full ${bgClass}`}
                                style={{ transform: toast.isExiting ? 'translateY(-12px) scale(0.95)' : 'translateY(0) scale(1)', opacity: toast.isExiting ? 0 : 1 }}
                            >
                                <i data-lucide={iconName} className="w-5 h-5 flex-shrink-0"></i>
                                <span className="text-sm font-semibold">{toast.mensagem}</span>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function ThemeSelector() {

            const [quantidade, setQuantidade] = useState(1);
            const [unidade, setUnidade] = useState('Unidade');
            const [estado, setEstado] = useState('Novo');
            const [destino, setDestino] = useState('Estoque Geral');

            useEffect(() => {
                if (item) {
                    setIdMaterial(item.id_material || '');
                    setDescricao(modo === 'consolidado' ? item.descricao : (item.descricao_item || ''));
                    setCategoria(item.id_categoria || (categorias[0] ? categorias[0].id_categoria : ''));
                    setQuantidade(modo === 'consolidado' ? item.quantidadeTotal : (item.quantidade || 1));

                        </div>

                        {adminSubTab === 'doadores' ? (
                            <div className="overflow-x-auto"><table className="w-full text-left"><thead><tr className="bg-gray-50 text-gray-500 text-[11px] uppercase font-bold"><th className="px-6 py-3.5">Nome</th><th className="px-6 py-3.5">Tipo</th><th className="px-6 py-3.5">Documento</th><th className="px-6 py-3.5 text-center">Ações</th></tr></thead><tbody className="divide-y divide-gray-100 text-xs">{doadoresFiltrados.map(d => (<tr key={d.id_doador} className="hover:bg-gray-50"><td className="px-6 py-4 font-medium text-gray-900">{d.nome}</td><td className="px-6 py-4">{d.tipo_doador}</td><td className="px-6 py-4 font-mono">{formatarDocumento(d.documento || '', d.tipo_doador)}</td><td className="px-6 py-4 text-center"><button onClick={() => onOpenEditDoador(d)} className="bg-blue-50 text-blue-600 p-2 rounded-lg"><i data-lucide="pencil" className="w-4 h-4"></i></button></td></tr>))}</tbody></table></div>
                        ) : (
                            <div className="overflow-x-auto"><table className="w-full text-left"><thead><tr className="bg-gray-50 text-gray-500 text-[11px] uppercase font-bold"><th className="px-6 py-3.5">Doador</th><th className="px-6 py-3.5">Canal</th><th className="px-6 py-3.5 text-center">Ações</th></tr></thead><tbody className="divide-y divide-gray-100 text-xs">{doacoesFiltradas.map(d => (<tr key={d.id_doacao} className="hover:bg-gray-50"><td className="px-6 py-4 font-medium text-gray-900">{d.doadores ? d.doadores.nome : 'Desconhecido'}</td><td className="px-6 py-4">{d.canal_recebimento}</td><td className="px-6 py-4 text-center"><button onClick={() => onOpenEditDoacao(d)} className="bg-blue-50 text-blue-600 p-2 rounded-lg"><i data-lucide="pencil" className="w-4 h-4"></i></button></td></tr>))}</tbody></table></div>
                        )}
                    </div>
                </div>
            );
        }

        function EstoqueTab({ isVisible, onOpenEditEstoque, onOpenEditEstoqueConsolidado, onOpenEditDoacao, onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [estoqueList, setEstoqueList] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            const carregarEstoque = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const { data } = await estoqueService.buscarEstoqueMateriais();
                    setEstoqueList(data || []);
                } catch (e) { console.error(e); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            useEffect(() => { if (isVisible) carregarEstoque(); }, [isVisible]);
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [isVisible, estoqueList, searchQuery]);
            if (!isVisible) return null;

            const handlePDF = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const res = await pdfService.exportarPDFEstoqueOficial();
                    if (res.success) mostrarToast('PDF baixado com sucesso!', 'success');
                } catch (e) { mostrarToast('Erro PDF: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const q = searchQuery.toLowerCase().trim();
            const filtrados = estoqueList.filter(m => m.descricao_item.toLowerCase().includes(q) || m.destino_item.toLowerCase().includes(q));

            return (
                <div id="tab-estoque" className="tab-content active visible space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex justify-between items-center">
                        <div><h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2"><i data-lucide="boxes" className="text-rose-600"></i> Controle de Estoque e Inventário</h2></div>
                        <button onClick={handlePDF} className="px-4 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center gap-2 cursor-pointer"><i data-lucide="file-text" className="w-4 h-4 text-rose-400"></i> Baixar Relatório PDF</button>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 space-y-4">
                        <div className="pb-4 border-b border-gray-100"><input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Buscar no estoque..." className="px-4 py-2 rounded-xl border border-gray-200 text-xs w-72" /></div>
                        <div className="overflow-x-auto"><table className="w-full text-left"><thead><tr className="bg-gray-50 text-gray-500 text-[11px] uppercase font-bold"><th className="px-6 py-3.5">Descrição</th><th className="px-6 py-3.5">Quantidade</th><th className="px-6 py-3.5">Unidade</th><th className="px-6 py-3.5">Destino</th><th className="px-6 py-3.5 text-center">Ações</th></tr></thead><tbody className="divide-y divide-gray-100 text-xs">{filtrados.map(m => (<tr key={m.id_material} className="hover:bg-gray-50"><td className="px-6 py-4 font-medium text-gray-900">{m.descricao_item}</td><td className="px-6 py-4 font-bold">{m.quantidade}</td><td className="px-6 py-4">{m.unidade_medida}</td><td className="px-6 py-4">{m.destino_item}</td><td className="px-6 py-4 text-center"><button onClick={() => onOpenEditEstoque(m)} className="bg-blue-50 text-blue-600 p-2 rounded-lg"><i data-lucide="pencil" className="w-4 h-4"></i></button></td></tr>))}</tbody></table></div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 7. VIEWS E ORQUESTRADOR PRINCIPAL
        // ==========================================
        function LoginView() {
            const { login } = useAuth();
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [errorMsg]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');
                const res = await login(email, password);
                if (!res.success) {
                    setErrorMsg(res.error ? res.error.message : 'Credenciais inválidas.');
                    setPassword('');
                }
            };

            return (
                <div id="global-login-container" className="min-h-screen flex items-center justify-center bg-slate-50 px-4 relative">
                    <div className="absolute top-6 right-6 z-20"><ThemeSelector /></div>
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 max-w-md w-full relative z-10 space-y-6">
                        <div className="text-center space-y-2">
                            <div className="bg-rose-600 text-white p-3 rounded-2xl w-14 h-14 mx-auto flex items-center justify-center shadow-md"><i data-lucide="shield-check" className="w-8 h-8"></i></div>
                            <h2 className="text-2xl font-extrabold text-slate-900">Portal Institucional</h2>
                            <p className="text-xs text-gray-500 font-medium">Acesso restrito para operadores autorizados</p>
                        </div>
                        <form id="form-global-login" onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">E-mail Corporativo</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required placeholder="E-mail de Acesso" className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:border-rose-500" /></div>
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Senha de Acesso</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required placeholder="Senha de Acesso" className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:border-rose-500" /></div>
                            {errorMsg && <p className="text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-100 flex items-center gap-2"><i data-lucide="alert-triangle" className="w-4 h-4"></i> {errorMsg}</p>}
                            <button type="submit" className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-md cursor-pointer flex items-center justify-center gap-2"><i data-lucide="log-in" className="w-4 h-4"></i> Entrar no Sistema</button>
                        </form>
                    </div>
                </div>
            );
        }

        function MainAppView({ onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [activeTab, setActiveTab] = useState('doador');
            const [doadoresGlobal, setDoadoresGlobal] = useState([]);
            const [categoriasGlobal, setCategoriasGlobal] = useState([]);

            const [editDoadorModalOpen, setEditDoadorModalOpen] = useState(false);
            const [selectedDoador, setSelectedDoador] = useState(null);

            const [editDoacaoModalOpen, setEditDoacaoModalOpen] = useState(false);
            const [selectedDoacao, setSelectedDoacao] = useState(null);

            const [editEstoqueModalOpen, setEditEstoqueModalOpen] = useState(false);
            const [selectedEstoqueItem, setSelectedEstoqueItem] = useState(null);

            const carregarDadosApp = async () => {
                try {
                    const { data: dData } = await doadoresService.buscarDoadores();
                    setDoadoresGlobal(dData || []);
                    const { data: cData } = await doacoesService.buscarCategoriasItens();
                    setCategoriasGlobal(cData || []);
                } catch (e) { console.error(e); }
            };

            useEffect(() => { carregarDadosApp(); }, []);
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [activeTab]);

            const handleSaveDoador = async (dados) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await doadoresService.atualizarDoador(dados.id_doador, dados);
                    mostrarToast('Doador atualizado com sucesso!', 'success');
                    setEditDoadorModalOpen(false);
                    carregarDadosApp();
                } catch (e) { mostrarToast('Erro: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const handleSaveDoacao = async (payload) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await doacoesService.atualizarDoacaoCompleta(payload.idDoacao, { id_doador: payload.idDoador, canal_recebimento: payload.canal, observacoes: payload.observacoes || null }, { id_doacao: payload.idDoacao, valor: payload.finValor, comprovante_transacao: payload.finComprovante || null }, { id_doacao: payload.idDoacao, id_categoria: payload.matCategoria, descricao_item: payload.matDescricao, quantidade: payload.matQtd, unidade_medida: payload.matUnidade, estado_conservacao: payload.matEstado, destino_item: payload.matDestino }, payload.checkFinanceiro, payload.checkMaterial, selectedDoacao);
                    mostrarToast('Doação atualizada com sucesso!', 'success');
                    setEditDoacaoModalOpen(false);
                    carregarDadosApp();
                } catch (e) { mostrarToast('Erro: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const handleSaveEstoque = async (payload) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await estoqueService.atualizarItemEstoqueLote(payload.idMaterial, { descricao_item: payload.novaDesc, id_categoria: payload.novaCat, quantidade: payload.novaQtd, unidade_medida: payload.novaUnidade, estado_conservacao: payload.novoEstado, destino_item: payload.novoDestino });
                    mostrarToast('Estoque atualizado com sucesso!', 'success');
                    setEditEstoqueModalOpen(false);
                    carregarDadosApp();
                } catch (e) { mostrarToast('Erro: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            return (
                <div id="app-container" className="max-w-6xl mx-auto px-4 py-8 space-y-6">
                    <Header />
                    <Navbar activeTab={activeTab} onSwitchTab={setActiveTab} />
                    <main className="pt-2">
                        <DoadorTab isVisible={activeTab === 'doador'} onDoadorCadastrado={carregarDadosApp} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                        <DoacaoMistaTab isVisible={activeTab === 'doacao_mista'} doadores={doadoresGlobal} categorias={categoriasGlobal} onDoacaoRegistrada={carregarDadosApp} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                        <AdminTab isVisible={activeTab === 'admin'} onOpenEditDoador={(d) => { setSelectedDoador(d); setEditDoadorModalOpen(true); }} onOpenEditDoacao={(d) => { setSelectedDoacao(d); setEditDoacaoModalOpen(true); }} onDataChanged={carregarDadosApp} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                        <EstoqueTab isVisible={activeTab === 'estoque'} onOpenEditEstoque={(m) => { setSelectedEstoqueItem(m); setEditEstoqueModalOpen(true); }} onOpenEditDoacao={(d) => { setSelectedDoacao(d); setEditDoacaoModalOpen(true); }} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                    </main>

                    <EditDoadorModal isOpen={editDoadorModalOpen} doador={selectedDoador} onClose={() => setEditDoadorModalOpen(false)} onSave={handleSaveDoador} />
                    <EditDoacaoModal isOpen={editDoacaoModalOpen} doacao={selectedDoacao} doadores={doadoresGlobal} categorias={categoriasGlobal} onClose={() => setEditDoacaoModalOpen(false)} onSave={handleSaveDoacao} />
                    <EditEstoqueModal isOpen={editEstoqueModalOpen} item={selectedEstoqueItem} modo="lote" categorias={categoriasGlobal} onClose={() => setEditEstoqueModalOpen(false)} onSave={handleSaveEstoque} />
                </div>
            );
        }

        function AppContent() {
            const { authenticated } = useAuth();
            const { mostrarToast } = useToast();
            const [progressWidth, setProgressWidth] = useState(0);
            const [progressOpacity, setProgressOpacity] = useState(0);

            const handleLoadingStart = () => {
                setProgressOpacity(1);
                setProgressWidth(0);
                setTimeout(() => setProgressWidth(30), 50);
                setTimeout(() => setProgressWidth(70), 200);
            };

            const handleLoadingEnd = () => {
                setProgressWidth(100);
                setTimeout(() => {
                    setProgressOpacity(0);
                    setTimeout(() => setProgressWidth(0), 300);
                }, 200);
            };

            return (
                <ThemeProvider onShowToast={mostrarToast}>
                    <ProgressBar width={progressWidth} opacity={progressOpacity} />
                    <ToastContainer />
                    {authenticated ? (
                        <MainAppView onLoadingStart={handleLoadingStart} onLoadingEnd={handleLoadingEnd} />
                    ) : (
                        <LoginView />
                    )}
                </ThemeProvider>
            );
        }

        function App() {
            return (
                <ToastProvider>
                    <AuthProvider>
                        <AppContent />
                    </AuthProvider>
                </ToastProvider>
            );
        }

        // Montagem do React na DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>

</html>
