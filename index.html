    <script type="text/babel">
        // ==========================================
        // 1. CONFIGURAÇÃO E UTILS

        const SUPABASE_URL = "https://bevvvsghutwpnexuczda.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CaMU6q53y-n9p0PXW4F1Ow_bgYrD9Mm";
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function formatarCPF(val) {
            if (!val) return "";
            val = val.replace(/\D/g, "").slice(0, 11);
            return val
                .replace(/^(\d{3})(\d)/, "$1.$2")
                .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
                .replace(/\.(\d{3})(\d)/, ".$1-$2");
        }

        function formatarCNPJ(val) {
            if (!val) return "";
            val = val.replace(/\D/g, "").slice(0, 14);
            return val
                .replace(/^(\d{2})(\d)/, "$1.$2")
                .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
                .replace(/\.(\d{3})(\d)/, ".$1/$2")
                .replace(/(\d{4})(\d)/, "$1-$2");
        }

        function formatarDocumento(val, tipo) {
            if (!val) return "";
            if (tipo === 'PF') return formatarCPF(val);
            if (tipo === 'PJ') return formatarCNPJ(val);
            const clean = val.replace(/\D/g, "");
            return clean.length > 11 ? formatarCNPJ(clean) : formatarCPF(clean);
        }

        function formatarTelefone(val) {
            if (!val) return "";
            val = val.replace(/\D/g, "").slice(0, 11);
            if (val.length > 10) {
                return val.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d)/, "$1-$2");
            } else {
                return val.replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{4})(\d)/, "$1-$2");
            }
        }

        function formatarMoeda(valor) {
            const num = parseFloat(valor || 0);
            return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatarDataBR(dataIso) {
            if (!dataIso) return '-';
            const partes = dataIso.split('-');
            if (partes.length === 3) {
                return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0].slice(0, 4)}`;
            }
            return dataIso;
        }

        // ==========================================
        // 2. SERVIÇOS BANCO DE DADOS E RELATÓRIOS
        // ==========================================
        const authService = {

                if (!supabaseClient) return { session: null };

                return { session };
            },
            realizarLoginSupabase: async (email, password) => {
                if (!supabaseClient) throw new Error("Supabase não configurado");
                return await supabaseClient.auth.signInWithPassword({ email, password });

            realizarLogoutSupabase: async () => {
                if (!supabaseClient) return;
                return await supabaseClient.auth.signOut();
            }
        };

        const doadoresService = {
            buscarDoadores: async () => {
                if (!supabaseClient) return { data: [], error: null };
                return await supabaseClient.from('doadores').select('id_doador, nome, tipo_doador, documento, telefone, email, cidade, data_nascimento').order('nome');
            },
            buscarDoadoresTodos: async () => {
                if (!supabaseClient) return { data: [], error: null };
                return await supabaseClient.from('doadores').select('*').order('nome');
            },
            criarDoador: async (dadosDoador) => {

            atualizarDoador: async (idDoador, dadosDoador) => {

        const doacoesService = {

                if (editHasFin) {
                    const originallyHadFin = originalDoacao && originalDoacao.doacoes_financeiras && originalDoacao.doacoes_financeiras.length > 0;

                        const { error } = await supabaseClient.from('doacoes_financeiras').update(dadosFin).eq('id_doacao', idDoacao);
                        if (error) throw error;
                    } else {
                        const { error } = await supabaseClient.from('doacoes_financeiras').insert([dadosFin]);

                } else {
                    const { error } = await supabaseClient.from('doacoes_financeiras').delete().eq('id_doacao', idDoacao);

                if (editHasMat) {
                    const originallyHadMat = originalDoacao && originalDoacao.doacoes_materiais && originalDoacao.doacoes_materiais.length > 0;

                        const { error } = await supabaseClient.from('doacoes_materiais').insert([dadosMat]);

        const estoqueService = {
            buscarEstoqueMateriais: async () => {
                if (!supabaseClient) return { data: [], error: null };
                const { data: matData, error } = await supabaseClient

            buscarEstoqueDoacoesCanais: async () => {

                if (error) return { data: [], error };
                const listaNormalizada = (doaData || []).map(d => {

            },
            atualizarEstoqueConsolidado: async (lotes, diferenca, novosDados) => {
                if (!supabaseClient) throw new Error("Supabase não disponível");
                let diferencaRestante = diferenca;
                const updatePromises = lotes.map((lote) => {
                    const quantidadeAtual = Number(lote.quantidade) || 0;
                    let qtdLote = quantidadeAtual;
                    if (diferencaRestante > 0) {
                        qtdLote += diferencaRestante;
                        diferencaRestante = 0;
                    } else if (diferencaRestante < 0) {
                        const reducao = Math.min(quantidadeAtual, -diferencaRestante);
                        qtdLote -= reducao;
                        diferencaRestante += reducao;
                    }
                    return supabaseClient.from('doacoes_materiais').update({ quantidade: qtdLote }).eq('id_material', lote.id_material);

                const resultados = await Promise.all(updatePromises);

        const pdfService = {

                doc.text(`ALIMENTOS: ${totalAlimentos} un.`, 150, 36.5);
                doc.text(`HIGIENE: ${totalHigiene} un.`, 220, 36.5);

                const grupos = {};

                        doc.text(`Rede de Combate ao Câncer - Sistema de Gestão de Doações e Estoque`, 14, 202);
                    }
                });

                const nomeArquivo = `Relatorio_Estoque_RedeCombateCancer_${dataFormatada.replace(/\//g, '-')}.pdf`;
                doc.save(nomeArquivo);
                return { success: true, filename: nomeArquivo };
            },
            exportarPDFDoacoesOficial: async () => {
                if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("jsPDF não disponível");
                const { data: doaData, error } = await doacoesService.buscarDoacoesAdmin();

                const doacoes = doaData || [];
                if (doacoes.length === 0) return { success: false, message: "Não há registros de doações para gerar PDF." };

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const agora = new Date();
                const dataFormatada = agora.toLocaleDateString('pt-BR');
                const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                doc.setFillColor(225, 29, 72);
                doc.rect(0, 0, 297, 24, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.text("REDE DE COMBATE AO CÂNCER", 14, 12);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text("RELATÓRIO GERAL DE DOAÇÕES E DOADORES", 14, 18);
                doc.setFontSize(9);
                doc.text(`Gerado em: ${dataFormatada} às ${horaFormatada}`, 283, 15, { align: 'right' });

                doc.setDrawColor(226, 232, 240);
                doc.roundedRect(14, 28, 269, 14, 2, 2, 'FD');

                doc.setFontSize(9);
                doc.setTextColor(51, 65, 85);
                doc.text(`TOTAL DOAÇÕES: ${doacoes.length}`, 20, 36.5);
                doc.text(`DOADORES ÚNICOS: ${doadoresSet.size}`, 85, 36.5);
                doc.text(`TOTAL FINANCEIRO: R$ ${totalFin.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`, 150, 36.5);

                const tableRows = doacoes.map((d, index) => {

                    return [index + 1, nomeDoador, dataDoacaoFmt, d.canal_recebimento || 'Presencial', detalhesArr.join(' | ') || 'Sem detalhes', d.observacoes || '-'];
                });

                doc.autoTable({
                    startY: 46,
                    head: [['#', 'Doador', 'Data', 'Canal', 'O que foi doado (Valores e Itens)', 'Observações']],

                    columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 55, fontStyle: 'bold' }, 2: { cellWidth: 22, halign: 'center' }, 3: { cellWidth: 30 }, 4: { cellWidth: 102 }, 5: { cellWidth: 50 } },

        // ==========================================
        // 3. REACT CONTEXT PROVIDERS
        // ==========================================
        const { createContext, useContext, useState, useEffect, useRef } = React;

        const AuthContext = createContext();
        function AuthProvider({ children, onLoadingStart, onLoadingEnd }) {
            const [authenticated, setAuthenticated] = useState(false);
            const [session, setSession] = useState(null);

            const checkAuth = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const { session: sess } = await authService.verificarSessaoSupabase();
                    setSession(sess);
                    setAuthenticated(Boolean(sess));
                } catch (e) {
                    console.error("Erro na checagem de autenticação:", e);
                } finally {
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            useEffect(() => { checkAuth(); }, []);

            const login = async (email, password) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const { data, error } = await authService.realizarLoginSupabase(email, password);
                    if (error) throw error;
                    setAuthenticated(true);
                    setSession(data ? data.session : null);
                    return { success: true };
                } catch (error) {
                    return { success: false, error };
                } finally {
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            const logout = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await authService.realizarLogoutSupabase();
                } catch (e) {
                    console.error(e);
                } finally {
                    setAuthenticated(false);
                    setSession(null);
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            return (
                <AuthContext.Provider value={{ authenticated, session, login, logout, checkAuth }}>
                    {children}
                </AuthContext.Provider>
            );
        }
        function useAuth() { return useContext(AuthContext); }

        const ThemeContext = createContext();
        function ThemeProvider({ children, onShowToast }) {
            const [theme, setThemeState] = useState(() => localStorage.getItem('site-theme') || 'light');
            const [menuOpen, setMenuOpen] = useState(false);

            const applyTheme = (newTheme) => {
                setThemeState(newTheme);
                localStorage.setItem('site-theme', newTheme);
                document.body.classList.remove('theme-light', 'theme-dark', 'theme-ultra-dark');
                document.documentElement.classList.remove('theme-light', 'theme-dark', 'theme-ultra-dark');
                document.body.classList.add('theme-' + newTheme);
                document.documentElement.classList.add('theme-' + newTheme);
            };

            useEffect(() => { applyTheme(theme); }, []);

            const changeTheme = (newTheme) => {
                applyTheme(newTheme);
                setMenuOpen(false);
                if (onShowToast) {
                    if (newTheme === 'ultra-dark') onShowToast('Modo Visão Sensível (Baixa Luminosidade) ativado!', 'info');
                    else if (newTheme === 'dark') onShowToast('Modo Escuro Padrão ativado!', 'info');
                    else onShowToast('Modo Claro Padrão ativado!', 'info');
                }
            };

            const toggleMenu = (e) => {
                if (e) e.stopPropagation();
                setMenuOpen(prev => !prev);
            };

            useEffect(() => {
                const handleOutsideClick = (e) => {
                    if (!e.target.closest('.theme-selector-container')) setMenuOpen(false);
                };
                document.addEventListener('click', handleOutsideClick);
                return () => document.removeEventListener('click', handleOutsideClick);
            }, []);

            return (
                <ThemeContext.Provider value={{ theme, changeTheme, menuOpen, toggleMenu }}>
                    {children}
                </ThemeContext.Provider>
            );
        }
        function useTheme() { return useContext(ThemeContext); }

        const ToastContext = createContext();
        function ToastProvider({ children }) {
            const [toasts, setToasts] = useState([]);

            const mostrarToast = (mensagem, tipo = 'success') => {
                const id = Date.now() + Math.random();
                const newToast = { id, mensagem, tipo, isExiting: false };
                setToasts(prev => [...prev, newToast]);
                setTimeout(() => removerToast(id), 4000);
            };

            const removerToast = (id) => {
                setToasts(prev => prev.map(t => t.id === id ? { ...t, isExiting: true } : t));
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 300);
            };

            return (
                <ToastContext.Provider value={{ toasts, mostrarToast, removerToast }}>
                    {children}
                </ToastContext.Provider>
            );
        }
        function useToast() { return useContext(ToastContext); }

                        let iconName = toast.tipo === 'success' ? 'check-circle-2' : toast.tipo === 'error' ? 'alert-circle' : 'info';

                                className={`toast-item p-4 rounded-xl shadow-lg border backdrop-blur-md flex items-center gap-3 transition-all duration-300 pointer-events-auto cursor-pointer max-w-sm w-full ${bgClass}`}

            useEffect(() => {
                if (item) {
                    setIdMaterial(item.id_material || '');
                    setDescricao(modo === 'consolidado' ? item.descricao : (item.descricao_item || ''));
                    setCategoria(item.id_categoria || (categorias[0] ? categorias[0].id_categoria : ''));
                    setQuantidade(modo === 'consolidado' ? item.quantidadeTotal : (item.quantidade || 1));
                    setUnidade(item.unidade || item.unidade_medida || 'Unidade');

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Qtd Total *</label><input type="number" min="0" value={quantidade} onChange={(e) => setQuantidade(e.target.value)} required className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-mono" /></div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Unidade *</label><select value={unidade} onChange={(e) => setUnidade(e.target.value)} disabled={modo === 'consolidado'} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm"><option value="Unidade">Unidade (un)</option><option value="Kg">Quilograma (kg)</option><option value="Pacote">Pacote (pct)</option></select></div>
                                <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Destino *</label><select value={destino} onChange={(e) => setDestino(e.target.value)} disabled={modo === 'consolidado'} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm"><option value="Estoque Geral">Estoque Geral</option><option value="Bazar">Bazar</option><option value="Uso Direto Paciente">Uso Direto Paciente</option></select></div>
                            </div>
                            <div className="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                                <button type="button" onClick={onClose} className="px-5 py-2.5 text-sm font-semibold text-gray-600">Cancelar</button>
                                <button type="submit" className="px-5 py-2.5 text-sm font-bold text-white bg-rose-600 rounded-xl">Salvar Alterações</button>
                            </div>
                        </form>
                    </div>
                </div>
            );

        function DoadorTab({ isVisible, onDoadorCadastrado, onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [nome, setNome] = useState('');
            const [tipoDoador, setTipoDoador] = useState('PF');
            const [documento, setDocumento] = useState('');
            const [telefone, setTelefone] = useState('');
            const [email, setEmail] = useState('');
            const [cidade, setCidade] = useState('');
            const [dataNascimento, setDataNascimento] = useState('');

            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [isVisible, tipoDoador]);
            if (!isVisible) return null;

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (onLoadingStart) onLoadingStart();
                try {
                    const { error } = await doadoresService.criarDoador({ nome, tipo_doador: tipoDoador, documento: documento || null, telefone: telefone || null, email: email || null, cidade: cidade || null, data_nascimento: dataNascimento || null });
                    if (error) mostrarToast('Erro ao salvar doador: ' + error.message, 'error');
                    else {
                        mostrarToast('Doador cadastrado com sucesso!', 'success');
                        setNome(''); setDocumento(''); setTelefone(''); setEmail(''); setCidade(''); setDataNascimento('');
                        if (onDoadorCadastrado) onDoadorCadastrado();
                    }
                } catch (err) { mostrarToast('Erro ao salvar doador: ' + err.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            return (
                <div id="tab-doador" className="tab-content active visible bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="user-plus" className="text-rose-600"></i> Cadastrar Novo Doador</h2>
                    <form id="form-doador" onSubmit={handleSubmit} className="space-y-4">
                        <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Nome Completo / Razão Social *</label><input type="text" value={nome} onChange={(e) => setNome(e.target.value)} required placeholder="Ex: Maria da Silva" className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-rose-500" /></div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Tipo de Doador *</label>
                                <div className="flex bg-gray-100 p-1 rounded-xl border border-gray-200/80 h-[42px] items-center">
                                    <button type="button" onClick={() => { setTipoDoador('PF'); setDocumento(formatarDocumento(documento, 'PF')); }} className={`flex-1 h-full text-sm font-semibold rounded-lg transition-all duration-200 cursor-pointer flex items-center justify-center gap-1.5 ${tipoDoador === 'PF' ? 'bg-white shadow-xs text-rose-600' : 'text-gray-500 hover:text-gray-800'}`}><i data-lucide="user" className="w-4 h-4"></i> PF</button>
                                    <button type="button" onClick={() => { setTipoDoador('PJ'); setDocumento(formatarDocumento(documento, 'PJ')); }} className={`flex-1 h-full text-sm font-semibold rounded-lg transition-all duration-200 cursor-pointer flex items-center justify-center gap-1.5 ${tipoDoador === 'PJ' ? 'bg-white shadow-xs text-rose-600' : 'text-gray-500 hover:text-gray-800'}`}><i data-lucide="building-2" className="w-4 h-4"></i> PJ</button>
                                </div>
                            </div>
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">{tipoDoador === 'PF' ? 'CPF *' : 'CNPJ *'}</label><input type="text" value={documento} onChange={(e) => setDocumento(formatarDocumento(e.target.value, tipoDoador))} maxLength={tipoDoador === 'PF' ? 14 : 18} placeholder={tipoDoador === 'PF' ? "000.000.000-00" : "00.000.000/0000-00"} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-mono" /></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">E-mail</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Ex: maria.silva@email.com" className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" /></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Cidade / UF</label><input type="text" value={cidade} onChange={(e) => setCidade(e.target.value)} placeholder="Ex: Astorga - PR" className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" /></div>
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Data Nasc./Fund.</label><input type="date" value={dataNascimento} onChange={(e) => setDataNascimento(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-mono" /></div>

                        <div className="pt-4 flex justify-end"><button type="submit" className="bg-rose-600 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:bg-rose-700 transition cursor-pointer flex items-center gap-2"><i data-lucide="save" className="w-5 h-5"></i> Salvar Doador</button></div>

        function DoacaoMistaTab({ isVisible, doadores, categorias, onDoacaoRegistrada, onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [idDoador, setIdDoador] = useState('');
            const [doadorSearchQuery, setDoadorSearchQuery] = useState('');
            const [dropdownOpen, setDropdownOpen] = useState(false);
            const [canal, setCanal] = useState('Presencial');
            const [observacoes, setObservacoes] = useState('');
            const [checkFinanceiro, setCheckFinanceiro] = useState(false);
            const [finValor, setFinValor] = useState('');
            const [finComprovante, setFinComprovante] = useState('');
            const [checkMaterial, setCheckMaterial] = useState(false);
            const [matDescricao, setMatDescricao] = useState('');
            const [matCategoria, setMatCategoria] = useState('');
            const [matQtd, setMatQtd] = useState(1);
            const [matUnidade, setMatUnidade] = useState('Unidade');
            const [matEstado, setMatEstado] = useState('Não se aplica');
            const [matDestino, setMatDestino] = useState('Estoque Geral');

            const searchContainerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                        setDropdownOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            useEffect(() => { if (categorias.length > 0 && !matCategoria) setMatCategoria(categorias[0].id_categoria); }, [categorias]);
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [isVisible, checkFinanceiro, checkMaterial, dropdownOpen]);
            if (!isVisible) return null;

            const doadoresFiltrados = doadores.filter(d => {
                const q = doadorSearchQuery.toLowerCase().trim();
                return !q || d.nome.toLowerCase().includes(q) || (d.documento && d.documento.includes(q));
            });

            const selecionarPreset = (tipo) => {
                const presets = {
                    'bazar': { catId: 6, desc: 'Itens de Bazar / Vestuário', unidade: 'Unidade', estado: 'Novo', destino: 'Bazar' },
                    'alimentos': { catId: 2, desc: 'Cesta Básica / Alimentos', unidade: 'Pacote', estado: 'Não se aplica', destino: 'Estoque Geral' },
                    'higiene': { catId: 3, desc: 'Produtos de Higiene Pessoal', unidade: 'Unidade', estado: 'Novo', destino: 'Estoque Geral' },
                    'cabelo': { catId: 4, desc: 'Peruca / Cabelo para Doação', unidade: 'Unidade', estado: 'Novo', destino: 'Estoque Geral' },
                    'ortopedicos': { catId: 5, desc: 'Equipamento Ortopédico', unidade: 'Unidade', estado: 'Seminovo', destino: 'Uso Direto Paciente' }
                };
                const p = presets[tipo];
                if (!p) return;
                setMatCategoria(p.catId); setMatDestino(p.destino); setMatUnidade(p.unidade); setMatEstado(p.estado); setMatDescricao(p.desc);
                if (!matQtd || matQtd <= 0) setMatQtd(1);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!checkFinanceiro && !checkMaterial) { mostrarToast('Marque pelo menos uma opção (Financeira ou Material).', 'error'); return; }
                if (!idDoador) { mostrarToast('Selecione um doador válido da lista.', 'error'); return; }
                if (onLoadingStart) onLoadingStart();
                try {
                    const { data: doacaoCriada, error: errorPai } = await doacoesService.criarEventoDoacao({ id_doador: parseInt(idDoador), canal_recebimento: canal, observacoes: observacoes || null });
                    if (errorPai) throw errorPai;
                    if (!doacaoCriada || doacaoCriada.length === 0) throw new Error('Não foi possível obter o identificador da doação criada.');
                    const idDoacaoGerado = doacaoCriada[0].id_doacao;
                    if (checkFinanceiro) {
                        const { error } = await doacoesService.criarDoacaoFinanceira({ id_doacao: idDoacaoGerado, valor: parseFloat(finValor), comprovante_transacao: finComprovante || null });
                        if (error) throw error;
                    }
                    if (checkMaterial) {
                        const { error } = await doacoesService.criarDoacaoMaterial({ id_doacao: idDoacaoGerado, id_categoria: parseInt(matCategoria), descricao_item: matDescricao, quantidade: parseInt(matQtd), unidade_medida: matUnidade, estado_conservacao: matEstado, destino_item: matDestino });
                        if (error) throw error;
                    }

                    mostrarToast('Doação registrada com sucesso!', 'success');
                    setIdDoador(''); setDoadorSearchQuery(''); setCheckFinanceiro(false); setFinValor(''); setCheckMaterial(false); setMatDescricao(''); setDropdownOpen(false);
                    if (onDoacaoRegistrada) onDoacaoRegistrada();
                } catch (err) { mostrarToast('Erro ao criar doação: ' + err.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            return (
                <div id="tab-doacao_mista" className="tab-content active visible bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="gift" className="text-rose-600"></i> Registrar Nova Doação (Mista / Financeira / Material)</h2>
                    <form id="form-doacao" onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="relative" ref={searchContainerRef}>
                                <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Pesquisar Doador *</label>
                                <div className="relative">
                                    <input type="text" autoComplete="off" value={doadorSearchQuery} onChange={(e) => { setDoadorSearchQuery(e.target.value); setDropdownOpen(true); }} onFocus={() => setDropdownOpen(true)} placeholder="Digite o nome..." className={`w-full px-4 py-2.5 rounded-xl border text-sm ${idDoador ? 'bg-rose-50/50 border-rose-300 font-semibold' : 'border-gray-200'}`} />
                                    {(idDoador || doadorSearchQuery) && (
                                        <button type="button" onClick={() => { setIdDoador(''); setDoadorSearchQuery(''); setDropdownOpen(false); }} className="absolute right-3 top-3 text-gray-400 hover:text-gray-600 cursor-pointer p-0.5 rounded-full hover:bg-gray-100 transition"><i data-lucide="x" className="w-4 h-4"></i></button>
                                    )}
                                </div>
                                {dropdownOpen && (
                                    <div className="absolute left-0 right-0 mt-1 max-h-56 overflow-y-auto bg-white border border-gray-200 rounded-2xl shadow-xl z-30">
                                        {doadoresFiltrados.length === 0 ? (
                                            <div className="p-4 text-center text-xs text-gray-400">Nenhum doador encontrado.</div>
                                        ) : (
                                            doadoresFiltrados.map(d => (
                                                <div key={d.id_doador} onClick={() => { setIdDoador(d.id_doador); setDoadorSearchQuery(d.nome); setDropdownOpen(false); }} className="p-3 hover:bg-rose-50 cursor-pointer border-b border-gray-50 text-sm font-semibold flex justify-between items-center">
                                                    <div><div>{d.nome}</div><div className="text-[11px] text-gray-500">Doc: {formatarDocumento(d.documento || '', d.tipo_doador)}</div></div>
                                                    {idDoador === d.id_doador && <i data-lucide="check" className="w-4 h-4 text-rose-600"></i>}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Canal de Recebimento *</label>
                                <select value={canal} onChange={(e) => setCanal(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm"><option value="Presencial">Presencial (Sede)</option><option value="PIX">PIX / Banco</option><option value="Dinheiro">Dinheiro / Bazar</option></select>
                            </div>
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Observações Internas</label>
                            <input type="text" value={observacoes} onChange={(e) => setObservacoes(e.target.value)} placeholder="Informações relevantes sobre a doação..." className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" />
                        </div>

                        <div className="p-4 bg-gray-50 rounded-2xl border border-gray-100 flex gap-6">
                            <label className="flex items-center gap-2 font-semibold text-sm cursor-pointer"><input type="checkbox" checked={checkFinanceiro} onChange={(e) => setCheckFinanceiro(e.target.checked)} className="accent-rose-600 w-4 h-4 rounded cursor-pointer" /> 💰 Doação Financeira</label>
                            <label className="flex items-center gap-2 font-semibold text-sm cursor-pointer"><input type="checkbox" checked={checkMaterial} onChange={(e) => setCheckMaterial(e.target.checked)} className="accent-rose-600 w-4 h-4 rounded cursor-pointer" /> 📦 Doação Material / Física</label>
                        </div>

                        {checkFinanceiro && (
                            <div className="p-4 bg-emerald-50/50 rounded-2xl border border-emerald-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Valor (R$) *</label><input type="number" min="0.01" step="0.01" value={finValor} onChange={(e) => setFinValor(e.target.value)} required placeholder="0.00" className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-mono" /></div>
                                <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Nº Comprovante / Transação</label><input type="text" value={finComprovante} onChange={(e) => setFinComprovante(e.target.value)} placeholder="Ex: TX-984201" className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-mono" /></div>
                            </div>
                        )}

                        {checkMaterial && (
                            <div className="p-4 bg-blue-50/50 rounded-2xl border border-blue-100 space-y-4">
                                <div>
                                    <label className="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Atalhos / Presets de Conteúdo</label>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => selecionarPreset('bazar')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 hover:border-rose-300 hover:text-rose-600 transition cursor-pointer">🛍️ Bazar</button>
                                        <button type="button" onClick={() => selecionarPreset('alimentos')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 hover:border-rose-300 hover:text-rose-600 transition cursor-pointer">🍞 Alimentos</button>
                                        <button type="button" onClick={() => selecionarPreset('higiene')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 hover:border-rose-300 hover:text-rose-600 transition cursor-pointer">🧴 Higiene</button>
                                        <button type="button" onClick={() => selecionarPreset('cabelo')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 hover:border-rose-300 hover:text-rose-600 transition cursor-pointer">✨ Cabelo</button>
                                        <button type="button" onClick={() => selecionarPreset('ortopedicos')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 hover:border-rose-300 hover:text-rose-600 transition cursor-pointer">♿ Ortopédicos</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Descrição Item *</label><input type="text" value={matDescricao} onChange={(e) => setMatDescricao(e.target.value)} required placeholder="Ex: Cesta Básica 15kg" className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" /></div>
                                    <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Categoria *</label><select value={matCategoria} onChange={(e) => setMatCategoria(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm">{categorias.map(c => <option key={c.id_categoria} value={c.id_categoria}>{c.nome_categoria}</option>)}</select></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Quantidade *</label><input type="number" min="1" value={matQtd} onChange={(e) => setMatQtd(e.target.value)} required className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-mono" /></div>
                                    <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Unidade de Medida *</label><select value={matUnidade} onChange={(e) => setMatUnidade(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm"><option value="Unidade">Unidade (un)</option><option value="Kg">Quilograma (kg)</option><option value="Pacote">Pacote (pct)</option><option value="Caixa">Caixa (cx)</option><option value="Litro">Litro (l)</option></select></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Estado de Conservação *</label><select value={matEstado} onChange={(e) => setMatEstado(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm"><option value="Novo">Novo (Lacre de fábrica)</option><option value="Seminovo">Seminovo (Ótimo estado)</option><option value="Usado">Usado (Bom estado)</option><option value="Não se aplica">Não se aplica (Alimentos / Descartáveis)</option></select></div>
                                    <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Destino Inicial *</label><select value={matDestino} onChange={(e) => setMatDestino(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm"><option value="Estoque Geral">Estoque Geral</option><option value="Bazar">Bazar Beneficente</option><option value="Uso Direto Paciente">Uso Direto Paciente</option></select></div>
                                </div>
                            </div>
                        )}
                        <div className="pt-4 flex justify-end"><button type="submit" className="bg-rose-600 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:bg-rose-700 transition cursor-pointer flex items-center gap-2"><i data-lucide="check-circle" className="w-5 h-5"></i> Registrar Doação Completa</button></div>
                    </form>
                </div>
            );
        }

        function AdminTab({ isVisible, onOpenEditDoador, onOpenEditDoacao, onDataChanged, onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [adminSubTab, setAdminSubTab] = useState('doadores');
            const [searchQuery, setSearchQuery] = useState('');
            const [expandedDoadorId, setExpandedDoadorId] = useState(null);

            const [doadoresList, setDoadoresList] = useState([]);
            const [doacoesList, setDoacoesList] = useState([]);
            const [loadingData, setLoadingData] = useState(false);

            const [metricDoadores, setMetricDoadores] = useState(0);
            const [metricDoacoes, setMetricDoacoes] = useState(0);
            const [metricFinanceiro, setMetricFinanceiro] = useState(0);
            const [metricMateriais, setMetricMateriais] = useState(0);

            const carregarMetricas = async () => {
                if (!supabaseClient) return;
                try {
                    const { count: doadoresCount } = await supabaseClient.from('doadores').select('*', { count: 'exact', head: true });
                    const { count: doacoesCount } = await supabaseClient.from('doacoes').select('*', { count: 'exact', head: true });
                    const { data: finData } = await supabaseClient.from('doacoes_financeiras').select('valor');
                    const totalFin = finData ? finData.reduce((acc, r) => acc + parseFloat(r.valor || 0), 0) : 0;
                    const { data: matData } = await supabaseClient.from('doacoes_materiais').select('quantidade');
                    const totalMat = matData ? matData.reduce((acc, r) => acc + parseInt(r.quantidade || 0), 0) : 0;

                    setMetricDoadores(doadoresCount || 0);
                    setMetricDoacoes(doacoesCount || 0);
                    setMetricFinanceiro(totalFin);
                    setMetricMateriais(totalMat);
                } catch (e) { console.error(e); }
            };

            const carregarDadosAdmin = async () => {
                setLoadingData(true);
                if (onLoadingStart) onLoadingStart();
                try {
                    await carregarMetricas();
                    const { data: dData } = await doadoresService.buscarDoadoresTodos();
                    setDoadoresList(dData || []);

                    const { data: doaData } = await doacoesService.buscarDoacoesAdmin();
                    setDoacoesList(doaData || []);
                } catch (e) { console.error(e); }
                finally {
                    setLoadingData(false);
                    if (onLoadingEnd) onLoadingEnd();
                }
            };

            useEffect(() => { if (isVisible) carregarDadosAdmin(); }, [isVisible]);
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [isVisible, adminSubTab, doadoresList, doacoesList, searchQuery, loadingData, expandedDoadorId]);
            if (!isVisible) return null;

            const handleDeleteDoador = async (idDoador, nome) => {
                if (!confirm(`ATENÇÃO: Ao excluir o doador "${nome}", TODAS as doações vinculadas a ele serão excluídas permanentemente! Deseja continuar?`)) return;
                if (onLoadingStart) onLoadingStart();
                try {
                    await doadoresService.deletarDoadorCascata(idDoador);
                    mostrarToast('Doador e doações associadas deletados com sucesso!', 'success');
                    await carregarDadosAdmin();
                    if (onDataChanged) onDataChanged();
                } catch (error) { mostrarToast('Erro ao excluir doador: ' + error.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const handleDeleteDoacao = async (idDoacao) => {
                if (!confirm('Deseja realmente excluir esta doação permanentemente?')) return;
                if (onLoadingStart) onLoadingStart();
                try {
                    await doacoesService.deletarDoacaoCompleta(idDoacao);
                    mostrarToast('Doação excluída com sucesso!', 'success');
                    await carregarDadosAdmin();
                    if (onDataChanged) onDataChanged();
                } catch (error) { mostrarToast('Erro ao excluir doação: ' + error.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const handleExportarPDF = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const res = await pdfService.exportarPDFDoacoesOficial();
                    if (res && res.success) mostrarToast('Relatório PDF baixado com sucesso!', 'success');
                    else if (res && res.message) mostrarToast(res.message, 'warning');
                } catch (err) { mostrarToast('Erro ao gerar PDF: ' + err.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const query = searchQuery.toLowerCase().trim();

            const doadoresFiltrados = doadoresList.filter(doador => {
                const basicMatch = doador.nome.toLowerCase().includes(query) ||
                    (doador.documento && doador.documento.includes(query)) ||
                    (doador.email && doador.email.toLowerCase().includes(query)) ||
                    (doador.telefone && doador.telefone.includes(query)) ||
                    (doador.cidade && doador.cidade.toLowerCase().includes(query));

                if (!query) return true;
                if (basicMatch) return true;

                const doacoesDoDoador = doacoesList.filter(d => d.id_doador === doador.id_doador);
                return doacoesDoDoador.some(doacao => {
                    const canalMatch = doacao.canal_recebimento && doacao.canal_recebimento.toLowerCase().includes(query);
                    const obsMatch = doacao.observacoes && doacao.observacoes.toLowerCase().includes(query);
                    let finMatch = false;
                    if (doacao.doacoes_financeiras) finMatch = doacao.doacoes_financeiras.some(f => String(f.valor).includes(query) || (f.comprovante_transacao && f.comprovante_transacao.toLowerCase().includes(query)));
                    let matMatch = false;
                    if (doacao.doacoes_materiais) matMatch = doacao.doacoes_materiais.some(m => m.descricao_item.toLowerCase().includes(query) || (m.destino_item && m.destino_item.toLowerCase().includes(query)));
                    return canalMatch || obsMatch || finMatch || matMatch;
                });
            });

            const doacoesFiltradas = doacoesList.filter(doacao => {
                const nomeDoador = doacao.doadores ? doacao.doadores.nome.toLowerCase() : '';
                const canal = doacao.canal_recebimento ? doacao.canal_recebimento.toLowerCase() : '';
                const obs = doacao.observacoes ? doacao.observacoes.toLowerCase() : '';
                let detMatch = false;
                if (doacao.doacoes_financeiras && doacao.doacoes_financeiras.length > 0) {
                    detMatch = detMatch || doacao.doacoes_financeiras.some(f => String(f.valor).includes(query) || (f.comprovante_transacao && f.comprovante_transacao.toLowerCase().includes(query)));
                }
                if (doacao.doacoes_materiais && doacao.doacoes_materiais.length > 0) {
                    detMatch = detMatch || doacao.doacoes_materiais.some(m => m.descricao_item.toLowerCase().includes(query) || (m.destino_item && m.destino_item.toLowerCase().includes(query)));
                }
                return nomeDoador.includes(query) || canal.includes(query) || obs.includes(query) || detMatch;
            });

            return (
                <div id="tab-admin" className="tab-content active visible space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-xs hover-scale"><div className="p-3 bg-rose-50 text-rose-600 rounded-2xl border border-rose-100"><i data-lucide="users" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Doadores Cadastrados</p><h3 className="text-2xl font-extrabold text-slate-900 tracking-tight leading-none mt-1">{metricDoadores}</h3></div></div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-xs hover-scale"><div className="p-3 bg-blue-50 text-blue-600 rounded-2xl border border-blue-100"><i data-lucide="gift" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Total de Eventos Doações</p><h3 className="text-2xl font-extrabold text-slate-900 tracking-tight leading-none mt-1">{metricDoacoes}</h3></div></div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-xs hover-scale"><div className="p-3 bg-emerald-50 text-emerald-600 rounded-2xl border border-emerald-100"><i data-lucide="dollar-sign" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Arrecadado (R$)</p><h3 className="text-2xl font-extrabold text-slate-900 tracking-tight leading-none mt-1">{formatarMoeda(metricFinanceiro)}</h3></div></div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 flex items-center gap-4 shadow-xs hover-scale"><div className="p-3 bg-amber-50 text-amber-600 rounded-2xl border border-amber-100"><i data-lucide="package" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Materiais Arrecadados</p><h3 className="text-2xl font-extrabold text-slate-900 tracking-tight leading-none mt-1">{metricMateriais} <span className="text-xs font-medium text-gray-400">itens</span></h3></div></div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 space-y-4">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-100 pb-4">
                            <div className="flex items-center gap-2 bg-slate-200 p-1.5 rounded-2xl">
                                <button onClick={() => { setAdminSubTab('doadores'); setSearchQuery(''); }} className={`sub-tab-btn px-4 py-2 text-xs font-extrabold rounded-xl transition-all duration-200 cursor-pointer flex items-center gap-2 ${adminSubTab === 'doadores' ? 'bg-white shadow-md text-rose-600' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}><i data-lucide="users" className="w-4 h-4"></i> Tabela de Doadores</button>
                                <button onClick={() => { setAdminSubTab('doacoes'); setSearchQuery(''); }} className={`sub-tab-btn px-4 py-2 text-xs font-extrabold rounded-xl transition-all duration-200 cursor-pointer flex items-center gap-2 ${adminSubTab === 'doacoes' ? 'bg-white shadow-md text-rose-600' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}><i data-lucide="heart-handshake" className="w-4 h-4"></i> Histórico de Doações</button>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="relative flex-1 md:w-64">
                                    <i data-lucide="search" className="w-4 h-4 absolute left-3.5 top-3 text-gray-400"></i>
                                    <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Buscar doador, item ou valor..." className="w-full pl-9 pr-4 py-2 rounded-xl border border-gray-200 text-xs focus:border-rose-500" />
                                </div>
                                <button onClick={handleExportarPDF} className="group bg-rose-600 text-white hover:bg-rose-700 active:bg-rose-800 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 cursor-pointer flex items-center gap-1.5 shadow-md shadow-rose-600/20 hover:shadow-lg hover:shadow-rose-600/30 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 whitespace-nowrap select-none" title="Baixar Relatório Oficial em PDF"><i data-lucide="file-text" className="w-4 h-4 transition-transform duration-200 group-hover:scale-110 group-hover:rotate-6"></i> Relatório PDF</button>
                            </div>
                        </div>

                        {adminSubTab === 'doadores' && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 text-[11px] uppercase tracking-wider font-bold border-b border-gray-200">
                                            <th className="px-6 py-3.5">Nome Completo / Razão Social</th>
                                            <th className="px-6 py-3.5">Tipo</th>
                                            <th className="px-6 py-3.5">Documento (CPF/CNPJ)</th>
                                            <th className="px-6 py-3.5">O que doou (Resumo & Detalhes)</th>
                                            <th className="px-6 py-3.5">Cidade</th>
                                            <th className="px-6 py-3.5">Telefone / E-mail</th>
                                            <th className="px-6 py-3.5 text-center">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 text-xs">
                                        {loadingData ? (
                                            <tr><td colSpan="7" className="px-6 py-10 text-center text-gray-400"><div className="flex flex-col items-center justify-center gap-3"><div className="w-8 h-8 border-4 border-rose-600 border-t-transparent rounded-full animate-spin"></div><span className="text-xs font-medium text-gray-500">Carregando dados...</span></div></td></tr>
                                        ) : doadoresFiltrados.length === 0 ? (
                                            <tr><td colSpan="7" className="px-6 py-8 text-center text-gray-500">Nenhum doador encontrado.</td></tr>
                                        ) : (
                                            doadoresFiltrados.map(doador => {
                                                const doacoesDoDoador = doacoesList.filter(d => d.id_doador === doador.id_doador);
                                                let totFinDoador = 0; let matItemsDoador = [];
                                                doacoesDoDoador.forEach(d => {
                                                    if (d.doacoes_financeiras) d.doacoes_financeiras.forEach(f => { totFinDoador += parseFloat(f.valor || 0); });
                                                    if (d.doacoes_materiais) d.doacoes_materiais.forEach(m => { matItemsDoador.push(m); });
                                                });
                                                const isExpanded = expandedDoadorId === doador.id_doador;
                                                return (
                                                    <React.Fragment key={doador.id_doador}>
                                                        <tr className={`hover:bg-gray-50 border-b border-gray-200 transition duration-150 ${isExpanded ? 'bg-rose-50/20' : ''}`}>
                                                            <td className="px-6 py-4 font-bold text-gray-900">{doador.nome}</td>
                                                            <td className="px-6 py-4 text-xs font-semibold text-gray-500">{doador.tipo_doador === 'PF' ? 'PF' : 'PJ'}</td>
                                                            <td className="px-6 py-4 font-mono text-xs">{formatarDocumento(doador.documento || '', doador.tipo_doador) || '-'}</td>
                                                            <td className="px-6 py-4 text-xs">
                                                                {doacoesDoDoador.length === 0 ? (
                                                                    <span className="text-gray-400 italic">Sem doações</span>
                                                                ) : (
                                                                    <div className="space-y-1.5 max-w-xs">
                                                                        <div className="flex flex-wrap items-center gap-1.5">
                                                                            {totFinDoador > 0 && <span className="bg-emerald-500/15 text-emerald-700 border border-emerald-500/30 text-[11px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 shadow-2xs"><i data-lucide="dollar-sign" className="w-3.5 h-3.5 text-emerald-600"></i> {formatarMoeda(totFinDoador)}</span>}
                                                                            {matItemsDoador.length > 0 && <span className="bg-blue-500/15 text-blue-700 border border-blue-500/30 text-[11px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 shadow-2xs" title={matItemsDoador.map(m => `${m.descricao_item} (${m.quantidade} ${m.unidade_medida})`).join(', ')}><i data-lucide="package" className="w-3.5 h-3.5 text-blue-600"></i> {matItemsDoador.reduce((a, m) => a + parseInt(m.quantidade || 0), 0)} itens</span>}
                                                                        </div>
                                                                        <button onClick={() => setExpandedDoadorId(isExpanded ? null : doador.id_doador)} className="text-[11px] font-bold text-rose-600 hover:text-rose-700 hover:underline flex items-center gap-1 cursor-pointer pt-0.5 transition"><i data-lucide={isExpanded ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5"></i> {isExpanded ? 'Ocultar detalhes' : `Ver detalhes (${doacoesDoDoador.length} doação${doacoesDoDoador.length > 1 ? 'ões' : ''})`}</button>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-4 text-xs">{doador.cidade || '-'}</td>
                                                            <td className="px-6 py-4 text-xs"><div className="font-medium text-gray-800">{formatarTelefone(doador.telefone || '') || '-'}</div>{doador.email && <div className="text-[11px] text-gray-500">{doador.email}</div>}</td>
                                                            <td className="px-6 py-4 text-center">
                                                                <div className="flex justify-center gap-2">
                                                                    <button onClick={() => onOpenEditDoador(doador)} className="bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200/60 p-2 rounded-xl cursor-pointer transition flex items-center justify-center w-8 h-8 shadow-2xs" title="Editar Doador"><i data-lucide="pencil" className="w-4 h-4"></i></button>

                                                                                        {doa.doacoes_materiais && doa.doacoes_materiais.map((m, i) => (<div key={i} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-between gap-2"><div className="font-semibold text-slate-800 text-xs flex items-center gap-1.5"><i data-lucide="package" className="w-4 h-4 text-amber-500 shrink-0"></i><span><strong>{m.descricao_item}</strong></span><span className="text-[11px] text-gray-500">• Destino: {m.destino_item} | Estado: {m.estado_conservacao}</span></div><span className="text-[11px] font-extrabold font-mono px-2.5 py-0.5 rounded-md bg-blue-500/15 text-blue-700 border border-blue-500/25 shrink-0">{m.quantidade} {m.unidade_medida}</span></div>))}

                                                                                </div>

                                                                {hasMat && <span className="bg-blue-500/15 text-blue-700 border border-blue-500/30 text-[11px] px-2.5 py-1 rounded-lg font-bold">Material</span>}
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 text-xs space-y-2 max-w-md">

                                                                <div key={fIdx} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/15 text-emerald-700 border border-emerald-500/30 font-extrabold text-xs shadow-2xs">

                                                                        <span className="shrink-0 text-[11px] font-extrabold font-mono px-2.5 py-0.5 rounded-md bg-blue-500/15 text-blue-700 border border-blue-500/25">
                                                                            {mat.quantidade} {mat.unidade_medida}

                                                                        <span>Destino: <strong className="text-gray-700">{mat.destino_item}</strong></span>

                                                                <button onClick={() => handleDeleteDoacao(doacao.id_doacao)} className="bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200/60 p-2 rounded-xl cursor-pointer transition flex items-center justify-center w-8 h-8 shadow-2xs" title="Excluir Doação"><i data-lucide="trash-2" className="w-4 h-4"></i></button>

        function EstoqueTab({ isVisible, onOpenEditEstoque, onOpenEditEstoqueConsolidado, onOpenEditDoacao, onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [estoqueSubTab, setEstoqueSubTab] = useState('Geral');
            const [modoVisao, setModoVisao] = useState('consolidado');
            const [searchQuery, setSearchQuery] = useState('');
            const [estoqueList, setEstoqueList] = useState([]);
            const [estoqueDoacoesList, setEstoqueDoacoesList] = useState([]);
            const [totalBazar, setTotalBazar] = useState(0);
            const [totalAlimentos, setTotalAlimentos] = useState(0);
            const [totalHigiene, setTotalHigiene] = useState(0);
            const [totalItens, setTotalItens] = useState(0);

            const carregarEstoque = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const { data: matData } = await estoqueService.buscarEstoqueMateriais();
                    const listMat = matData || [];
                    setEstoqueList(listMat);

                    const { data: doaData } = await estoqueService.buscarEstoqueDoacoesCanais();
                    setEstoqueDoacoesList(doaData || []);

                    setTotalBazar(listMat.filter(m => m.destino_item === 'Bazar' || m.id_categoria === 6).reduce((acc, item) => acc + parseInt(item.quantidade || 0), 0));
                    setTotalAlimentos(listMat.filter(m => m.id_categoria === 2).reduce((acc, item) => acc + parseInt(item.quantidade || 0), 0));
                    setTotalHigiene(listMat.filter(m => m.id_categoria === 3).reduce((acc, item) => acc + parseInt(item.quantidade || 0), 0));
                    setTotalItens(listMat.reduce((acc, item) => acc + parseInt(item.quantidade || 0), 0));
                } catch (e) { console.error(e); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            useEffect(() => { if (isVisible) carregarEstoque(); }, [isVisible]);
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [isVisible, estoqueSubTab, modoVisao, searchQuery, estoqueList]);
            if (!isVisible) return null;

            const handlePDF = async () => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const res = await pdfService.exportarPDFEstoqueOficial();
                    if (res.success) mostrarToast('PDF baixado com sucesso!', 'success');
                } catch (e) { mostrarToast('Erro PDF: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const isCanalTab = ['Presencial', 'PIX', 'Dinheiro'].includes(estoqueSubTab);
            const q = searchQuery.toLowerCase().trim();

            let materiaisFiltrados = [];
            if (estoqueSubTab === 'Geral') materiaisFiltrados = estoqueList;
            else if (estoqueSubTab === 'Bazar') materiaisFiltrados = estoqueList.filter(m => m.destino_item === 'Bazar' || m.id_categoria === 6);
            else {
                const mapCat = { 'Alimentos': 2, 'Higiene': 3, 'Cabelo': 4, 'Ortopedicos': 5 };
                materiaisFiltrados = estoqueList.filter(m => m.id_categoria === mapCat[estoqueSubTab]);
            }

            if (q) materiaisFiltrados = materiaisFiltrados.filter(m => m.descricao_item.toLowerCase().includes(q) || m.destino_item.toLowerCase().includes(q));

            const gruposConsolidados = {};
            if (modoVisao === 'consolidado') {
                materiaisFiltrados.forEach(item => {
                    const categoria = item.categorias_itens?.nome_categoria || 'Sem categoria';
                    const key = `categoria-${item.id_categoria || categoria.toLowerCase()}`;
                    if (!gruposConsolidados[key]) {
                        gruposConsolidados[key] = { key, descricao: categoria, quantidadeTotal: 0, unidade: 'Itens', destino: item.destino_item === 'Bazar' || item.id_categoria === 6 ? 'Bazar' : 'Estoque Geral', lotes: [] };
                    }
                    gruposConsolidados[key].quantidadeTotal += parseInt(item.quantidade || 0);
                    gruposConsolidados[key].lotes.push(item);
                });
            }

            return (
                <div id="tab-estoque" className="tab-content active visible space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 flex justify-between items-center">
                        <div><h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2"><i data-lucide="boxes" className="text-rose-600"></i> Controle Integrado de Estoque e Inventário</h2></div>
                        <button onClick={handlePDF} className="group px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-bold text-xs flex items-center gap-2 cursor-pointer transition-all duration-200 shadow-md hover:shadow-lg hover:shadow-slate-900/25 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 select-none"><i data-lucide="file-text" className="w-4 h-4 text-rose-400 transition-transform duration-200 group-hover:scale-110 group-hover:rotate-6"></i> Baixar Relatório PDF</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-rose-100 bg-rose-50/20 flex items-center gap-4"><div className="p-3 bg-rose-100 text-rose-700 rounded-2xl"><i data-lucide="shopping-bag" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-rose-700 uppercase">Bazar</p><h3 className="text-xl font-extrabold mt-1">{totalBazar} un.</h3></div></div>
                        <div className="bg-white p-5 rounded-2xl border border-amber-100 bg-amber-50/20 flex items-center gap-4"><div className="p-3 bg-amber-100 text-amber-700 rounded-2xl"><i data-lucide="apple" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-amber-700 uppercase">Alimentos</p><h3 className="text-xl font-extrabold mt-1">{totalAlimentos} un.</h3></div></div>
                        <div className="bg-white p-5 rounded-2xl border border-sky-100 bg-sky-50/20 flex items-center gap-4"><div className="p-3 bg-sky-100 text-sky-700 rounded-2xl"><i data-lucide="droplet" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-sky-700 uppercase">Higiene</p><h3 className="text-xl font-extrabold mt-1">{totalHigiene} un.</h3></div></div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4"><div className="p-3 bg-slate-100 text-slate-700 rounded-2xl"><i data-lucide="package" className="w-6 h-6"></i></div><div><p className="text-xs font-bold text-slate-500 uppercase">Total Geral</p><h3 className="text-xl font-extrabold mt-1">{totalItens} itens</h3></div></div>
                    </div>

                    <div className="space-y-4 mb-6 border-b border-gray-200 pb-6">
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setEstoqueSubTab('Geral')} className={`px-4 py-2 text-xs font-bold rounded-xl border ${estoqueSubTab === 'Geral' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-gray-600 border-gray-200'}`}>📦 Estoque Geral</button>
                            <button onClick={() => setEstoqueSubTab('Bazar')} className={`px-3.5 py-2 text-xs font-medium rounded-xl border ${estoqueSubTab === 'Bazar' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-gray-600 border-gray-200'}`}>🛍️ Bazar</button>
                            <button onClick={() => setEstoqueSubTab('Alimentos')} className={`px-3.5 py-2 text-xs font-medium rounded-xl border ${estoqueSubTab === 'Alimentos' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-white text-gray-600 border-gray-200'}`}>🍞 Alimentos</button>
                            <button onClick={() => setEstoqueSubTab('Higiene')} className={`px-3.5 py-2 text-xs font-medium rounded-xl border ${estoqueSubTab === 'Higiene' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-white text-gray-600 border-gray-200'}`}>🧴 Higiene</button>
                            <button onClick={() => setEstoqueSubTab('Cabelo')} className={`px-3.5 py-2 text-xs font-medium rounded-xl border ${estoqueSubTab === 'Cabelo' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-white text-gray-600 border-gray-200'}`}>✨ Cabelo</button>
                            <button onClick={() => setEstoqueSubTab('Ortopedicos')} className={`px-3.5 py-2 text-xs font-medium rounded-xl border ${estoqueSubTab === 'Ortopedicos' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-white text-gray-600 border-gray-200'}`}>♿ Ortopédicos</button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-xs border border-gray-100 space-y-4">
                        <div className="flex justify-between items-center pb-4 border-b border-gray-100">
                            <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Buscar itens no estoque..." className="px-4 py-2 rounded-xl border border-gray-200 text-xs w-72" />
                            <div className="flex gap-2 bg-slate-100 p-1 rounded-xl text-xs">
                                <button onClick={() => setModoVisao('consolidado')} className={`px-3 py-1.5 rounded-lg font-semibold ${modoVisao === 'consolidado' ? 'bg-rose-600 text-white' : 'text-slate-600'}`}>Consolidado</button>
                                <button onClick={() => setModoVisao('lotes')} className={`px-3 py-1.5 rounded-lg font-semibold ${modoVisao === 'lotes' ? 'bg-rose-600 text-white' : 'text-slate-600'}`}>Lotes</button>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead>
                                    {modoVisao === 'consolidado' ? (
                                        <tr className="bg-gray-50 text-gray-500 text-[11px] uppercase font-bold"><th className="px-6 py-3.5">Item Consolidado</th><th className="px-6 py-3.5 text-center">Total Acumulado</th><th className="px-6 py-3.5">Unidade</th><th className="px-6 py-3.5">Destino</th><th className="px-6 py-3.5 text-center">Ações</th></tr>
                                    ) : (
                                        <tr className="bg-gray-50 text-gray-500 text-[11px] uppercase font-bold"><th className="px-6 py-3.5">Descrição</th><th className="px-6 py-3.5 text-center">Quantidade</th><th className="px-6 py-3.5">Unidade</th><th className="px-6 py-3.5">Destino</th><th className="px-6 py-3.5 text-center">Ações</th></tr>
                                    )}
                                </thead>
                                <tbody className="divide-y divide-gray-100 text-xs">
                                    {modoVisao === 'consolidado' ? (
                                        Object.values(gruposConsolidados).map(g => (
                                            <tr key={g.key} className="hover:bg-gray-50"><td className="px-6 py-4 font-bold">{g.descricao}</td><td className="px-6 py-4 text-center font-extrabold text-rose-600">{g.quantidadeTotal}</td><td className="px-6 py-4">{g.unidade}</td><td className="px-6 py-4">{g.destino}</td><td className="px-6 py-4 text-center"><button onClick={() => onOpenEditEstoqueConsolidado(g)} className="bg-blue-50 text-blue-600 p-2 rounded-lg"><i data-lucide="pencil" className="w-4 h-4"></i></button></td></tr>
                                        ))
                                    ) : (
                                        materiaisFiltrados.map(m => (
                                            <tr key={m.id_material} className="hover:bg-gray-50"><td className="px-6 py-4 font-medium">{m.descricao_item}</td><td className="px-6 py-4 text-center font-bold">{m.quantidade}</td><td className="px-6 py-4">{m.unidade_medida}</td><td className="px-6 py-4">{m.destino_item}</td><td className="px-6 py-4 text-center"><button onClick={() => onOpenEditEstoque(m)} className="bg-blue-50 text-blue-600 p-2 rounded-lg"><i data-lucide="pencil" className="w-4 h-4"></i></button></td></tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }
