        // 7. VIEWS E ORQUESTRADOR PRINCIPAL
        // ==========================================
        function LoginView() {
            const { login } = useAuth();
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [errorMsg]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');
                const res = await login(email, password);
                if (!res.success) {
                    setErrorMsg(res.error ? res.error.message : 'Credenciais inválidas.');
                    setPassword('');
                }
            };

            return (
                <div id="global-login-container" className="min-h-screen flex items-center justify-center bg-slate-50 px-4 relative">
                    <div className="absolute top-6 right-6 z-20"><ThemeSelector /></div>
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 max-w-md w-full relative z-10 space-y-6">
                        <div className="text-center space-y-2">
                            <div className="bg-rose-600 text-white p-3 rounded-2xl w-14 h-14 mx-auto flex items-center justify-center shadow-md"><i data-lucide="shield-check" className="w-8 h-8"></i></div>
                            <h2 className="text-2xl font-extrabold text-slate-900">Portal Institucional</h2>
                            <p className="text-xs text-gray-500 font-medium">Acesso restrito para operadores autorizados</p>
                        </div>
                        <form id="form-global-login" onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">E-mail Corporativo</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required placeholder="E-mail de Acesso" className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:border-rose-500" /></div>
                            <div><label className="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Senha de Acesso</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required placeholder="Senha de Acesso" className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:border-rose-500" /></div>
                            {errorMsg && <p className="text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-100 flex items-center gap-2"><i data-lucide="alert-triangle" className="w-4 h-4"></i> {errorMsg}</p>}
                            <button type="submit" className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-md cursor-pointer flex items-center justify-center gap-2"><i data-lucide="log-in" className="w-4 h-4"></i> Entrar no Sistema</button>
                        </form>
                    </div>
                </div>
            );
        }

        function MainAppView({ onLoadingStart, onLoadingEnd }) {
            const { mostrarToast } = useToast();
            const [activeTab, setActiveTab] = useState('doador');
            const [doadoresGlobal, setDoadoresGlobal] = useState([]);
            const [categoriasGlobal, setCategoriasGlobal] = useState([]);

            const [editDoadorModalOpen, setEditDoadorModalOpen] = useState(false);
            const [selectedDoador, setSelectedDoador] = useState(null);

            const [editDoacaoModalOpen, setEditDoacaoModalOpen] = useState(false);
            const [selectedDoacao, setSelectedDoacao] = useState(null);

            const [editEstoqueModalOpen, setEditEstoqueModalOpen] = useState(false);
            const [selectedEstoqueItem, setSelectedEstoqueItem] = useState(null);
            const [estoqueEditMode, setEstoqueEditMode] = useState('lote');

            const carregarDadosApp = async () => {
                try {
                    const { data: dData } = await doadoresService.buscarDoadores();
                    setDoadoresGlobal(dData || []);
                    const { data: cData } = await doacoesService.buscarCategoriasItens();
                    setCategoriasGlobal(cData || []);
                } catch (e) { console.error(e); }
            };

            useEffect(() => { carregarDadosApp(); }, []);
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [activeTab]);

            const handleSaveDoador = async (dados) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await doadoresService.atualizarDoador(dados.id_doador, dados);
                    mostrarToast('Doador atualizado com sucesso!', 'success');
                    setEditDoadorModalOpen(false);
                    carregarDadosApp();
                } catch (e) { mostrarToast('Erro: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const handleSaveDoacao = async (payload) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    await doacoesService.atualizarDoacaoCompleta(payload.idDoacao, { id_doador: payload.idDoador, canal_recebimento: payload.canal, observacoes: payload.observacoes || null }, { id_doacao: payload.idDoacao, valor: payload.finValor, comprovante_transacao: payload.finComprovante || null }, { id_doacao: payload.idDoacao, id_categoria: payload.matCategoria, descricao_item: payload.matDescricao, quantidade: payload.matQtd, unidade_medida: payload.matUnidade, estado_conservacao: payload.matEstado, destino_item: payload.matDestino }, payload.checkFinanceiro, payload.checkMaterial, selectedDoacao);
                    mostrarToast('Doação atualizada com sucesso!', 'success');
                    setEditDoacaoModalOpen(false);
                    carregarDadosApp();
                } catch (e) { mostrarToast('Erro: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            const handleSaveEstoque = async (payload) => {
                if (onLoadingStart) onLoadingStart();
                try {
                    const novosDados = { descricao_item: payload.novaDesc, id_categoria: payload.novaCat, unidade_medida: payload.novaUnidade, estado_conservacao: payload.novoEstado, destino_item: payload.novoDestino };
                    if (payload.modo === 'consolidado') {
                        if (!selectedEstoqueItem || !selectedEstoqueItem.lotes) throw new Error('Dados dos lotes não encontrados.');
                        const diferenca = payload.novaQtd - selectedEstoqueItem.quantidadeTotal;
                        await estoqueService.atualizarEstoqueConsolidado(selectedEstoqueItem.lotes, diferenca, novosDados);
                    } else {
                        await estoqueService.atualizarItemEstoqueLote(payload.idMaterial, { ...novosDados, quantidade: payload.novaQtd });
                    }
                    mostrarToast('Estoque atualizado com sucesso!', 'success');
                    setEditEstoqueModalOpen(false);
                    carregarDadosApp();
                } catch (e) { mostrarToast('Erro: ' + e.message, 'error'); }
                finally { if (onLoadingEnd) onLoadingEnd(); }
            };

            return (
                <div id="app-container" className="max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <Header />
                    <Navbar activeTab={activeTab} onSwitchTab={setActiveTab} />
                    <main className="pt-2">
                        <DoadorTab isVisible={activeTab === 'doador'} onDoadorCadastrado={carregarDadosApp} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                        <DoacaoMistaTab isVisible={activeTab === 'doacao_mista'} doadores={doadoresGlobal} categorias={categoriasGlobal} onDoacaoRegistrada={carregarDadosApp} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                        <AdminTab isVisible={activeTab === 'admin'} onOpenEditDoador={(d) => { setSelectedDoador(d); setEditDoadorModalOpen(true); }} onOpenEditDoacao={(d) => { setSelectedDoacao(d); setEditDoacaoModalOpen(true); }} onDataChanged={carregarDadosApp} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                <EstoqueTab isVisible={activeTab === 'estoque'} onOpenEditEstoque={(m) => { setSelectedEstoqueItem(m); setEstoqueEditMode('lote'); setEditEstoqueModalOpen(true); }} onOpenEditEstoqueConsolidado={(m) => { setSelectedEstoqueItem(m); setEstoqueEditMode('consolidado'); setEditEstoqueModalOpen(true); }} onOpenEditDoacao={(d) => { setSelectedDoacao(d); setEditDoacaoModalOpen(true); }} onLoadingStart={onLoadingStart} onLoadingEnd={onLoadingEnd} />
                    </main>

                    <EditDoadorModal isOpen={editDoadorModalOpen} doador={selectedDoador} onClose={() => setEditDoadorModalOpen(false)} onSave={handleSaveDoador} />
                    <EditDoacaoModal isOpen={editDoacaoModalOpen} doacao={selectedDoacao} doadores={doadoresGlobal} categorias={categoriasGlobal} onClose={() => setEditDoacaoModalOpen(false)} onSave={handleSaveDoacao} />
                <EditEstoqueModal isOpen={editEstoqueModalOpen} item={selectedEstoqueItem} modo={estoqueEditMode} categorias={categoriasGlobal} onClose={() => setEditEstoqueModalOpen(false)} onSave={handleSaveEstoque} />
                </div>
            );
        }

        function AppContent() {
            const { authenticated } = useAuth();
            const { mostrarToast } = useToast();
            const [progressWidth, setProgressWidth] = useState(0);
            const [progressOpacity, setProgressOpacity] = useState(0);

            const handleLoadingStart = () => {
                setProgressOpacity(1);
                setProgressWidth(0);
                setTimeout(() => setProgressWidth(30), 50);
                setTimeout(() => setProgressWidth(70), 200);
            };

            const handleLoadingEnd = () => {
                setProgressWidth(100);
                setTimeout(() => {
                    setProgressOpacity(0);
                    setTimeout(() => setProgressWidth(0), 300);
                }, 200);
            };

            return (
                <ThemeProvider onShowToast={mostrarToast}>
                    <ProgressBar width={progressWidth} opacity={progressOpacity} />
                    <ToastContainer />
                    {authenticated ? (
                        <MainAppView onLoadingStart={handleLoadingStart} onLoadingEnd={handleLoadingEnd} />
                    ) : (
                        <LoginView />
                    )}
                </ThemeProvider>
            );
        }

        function App() {
            return (
                <ToastProvider>
                    <AuthProvider>
                        <AppContent />
                    </AuthProvider>
                </ToastProvider>
            );
        }

        // Montagem do React na DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>

</html>
